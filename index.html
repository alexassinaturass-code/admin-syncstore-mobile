*{

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

.premium-bg{
  background:linear-gradient(180deg,#0f172a 0%,#14203a 48%,#1e293b 100%);
  background-attachment:fixed;
}

.glass{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:18px;
  box-shadow:0 14px 34px rgba(0,0,0,.22);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease, background-color .15s ease;
  will-change:transform;
}

@media (hover:hover){
  button:hover{
    transform:translateY(-2px) scale(1.02);
    filter:brightness(1.08) saturate(1.05);
    box-shadow:0 10px 22px rgba(0,0,0,.28);
  }
}

button:active{
  transform:translateY(0) scale(.96);
  filter:brightness(.98);
}

button:disabled{
  transform:none;
  filter:none;
  box-shadow:none;
}

button:focus-visible{
  outline:3px solid rgba(56,189,248,.85);
  outline-offset:2px;
}

a.btn-primary{
  display:flex;
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
}

@media (hover:hover){
  a.btn-primary:hover{
    transform:translateY(-2px) scale(1.02);
    filter:brightness(1.08);
    box-shadow:0 10px 22px rgba(0,0,0,.28);
  }
}

a.btn-primary:active{
  transform:scale(.96);
}

/* Botões principais: brilho que atravessa + gradiente em movimento + pulso suave */

.btn-primary{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  background-size:180% 180% !important;
  animation:gradient-pan 2.5s ease-in-out infinite;
}

.btn-primary::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(105deg, transparent 32%, rgba(255,255,255,.5) 50%, transparent 68%);
  transform:translateX(-130%);
  animation:shine-sweep 2.5s ease-in-out infinite;
  pointer-events:none;
}

.btn-glow{
  animation:gradient-pan 2.5s ease-in-out infinite, glow-pulse 2.5s ease-in-out infinite;
}

.btn-salvo{
  background-image:linear-gradient(90deg,#16a34a,#22c55e,#16a34a) !important;
  animation:gradient-pan 2.5s ease-in-out infinite;
}

.btn-whatsapp{
  animation:whatsapp-pulse 2.5s ease-in-out infinite;
}

.btn-dias.bounce-click{
  animation:dias-bounce .45s ease;
}

.tab-btn{
  transition:transform .15s ease, background-color .15s ease, color .15s ease;
}

.tab-btn .tab-icon{
  display:inline-flex;
  transition:transform .15s ease;
}

.tab-btn.tab-ativa .tab-icon{
  transform:translateY(-3px);
}

.tab-btn.tab-ativa{
  animation:tab-slide .25s ease;
}

.btn-gerar:hover{
  animation:wiggle .45s ease-in-out;
}

.btn-refresh:hover svg{
  animation:spin-once .7s ease-in-out;
}

.btn-copiado{
  animation:pop-in .35s ease;
}

@keyframes gradient-pan{
  0%,100%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }
}

@keyframes shine-sweep{
  0%,55%{
    transform:translateX(-130%);
  }

  85%,100%{
    transform:translateX(130%);
  }
}

@keyframes glow-pulse{
  0%,100%{
    box-shadow:0 10px 26px rgba(16,185,129,.28);
  }

  50%{
    box-shadow:0 14px 34px rgba(37,99,235,.42);
  }
}

@keyframes whatsapp-pulse{
  0%,100%{
    box-shadow:0 0 0 0 rgba(34,197,94,.45);
  }

  50%{
    box-shadow:0 0 0 7px rgba(34,197,94,0);
  }
}

@keyframes dias-bounce{
  0%{
    transform:scale(.96);
  }

  40%{
    transform:scale(1.08) translateY(-3px);
  }

  70%{
    transform:scale(.98);
  }

  100%{
    transform:scale(1);
  }
}

@keyframes tab-slide{
  from{
    transform:translateY(3px);
  }

  to{
    transform:translateY(0);
  }
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(0deg);
  }

  25%{
    transform:rotate(-5deg) scale(1.04);
  }

  75%{
    transform:rotate(5deg) scale(1.04);
  }
}

@keyframes spin-once{
  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }
}

@keyframes pop-in{
  0%{
    transform:scale(.85);
  }

  60%{
    transform:scale(1.08);
  }

  100%{
    transform:scale(1);
  }
}

@media (prefers-reduced-motion: reduce){
  button, .btn-primary, .btn-primary::after, .btn-glow, .btn-salvo, .btn-whatsapp, .btn-dias.bounce-click, .tab-btn, .tab-btn .tab-icon, .btn-gerar:hover, .btn-refresh:hover svg, .btn-copiado{
    transition:none !important;
    animation:none !important;
    transform:none !important;
  }
}
